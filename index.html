<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>yourJPconcept — Bình chọn Concept Sự Kiện</title>
  <meta name="description"
    content="Trang bình chọn các concept thiết kế sự kiện phong cách Nhật Bản. Cùng chọn ra concept ấn tượng nhất cho sự kiện tiếp theo!">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
    rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/admin.css">
</head>

<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="brand" onclick="location.hash='#/'" role="button" aria-label="Trang chủ yourJPconcept">
      <img src="image/logo .png" alt="yourJPconcept Logo" class="brand-logo-img">
      <div class="brand-info">
        <span class="brand-name">yourJPconcept</span>
        <span class="brand-sub">コンセプト投票 • BÌNH CHỌN CONCEPT</span>
      </div>
    </div>

    <div class="header-actions">
      <button type="button" class="btn-petal-toggle" id="petal-toggle-btn" title="Bật / tắt hiệu ứng cánh hoa rơi">
        🌸 Hoa rơi: Bật
      </button>
      <nav class="site-nav" id="site-nav">
        <a href="#/" id="nav-home">Trang chủ</a>
        <a href="#/admin" id="nav-admin">Admin</a>
      </nav>
    </div>
  </header>

  <!-- Main SPA Viewport -->
  <div id="app">
    <div class="loading-state">
      <div class="spinner"></div>
      <div>Đang tải danh sách concept...</div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Lightbox Modal for High-Res Image Preview -->
  <div class="lightbox-modal" id="lightbox-modal" role="dialog" aria-label="Xem ảnh phóng to">
    <div class="lightbox-content">
      <button type="button" class="lightbox-close-btn" id="lightbox-close-btn" aria-label="Đóng">&times;</button>
      <img src="" alt="" class="lightbox-img" id="lightbox-img">
      <div class="lightbox-footer">
        <span class="lightbox-title" id="lightbox-title"></span>
        <a href="#" class="btn btn-secondary" id="lightbox-download-btn" style="padding:6px 14px; font-size:0.82rem;"
          target="_blank" rel="noopener">⬇️ Tải ảnh về</a>
      </div>
    </div>
  </div>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="footer-content">
      <p><strong>yourJPconcept</strong> — Nền tảng bình chọn & định hướng concept thiết kế sự kiện phong cách Nhật Bản.
      </p>
      <div class="footer-links">
        <a href="#/">Trang chủ bình chọn</a>
        <span>•</span>
        <a href="#/admin">Khu vực Quản trị Admin</a>
      </div>
    </div>
  </footer>

  <!-- Scripts: Modular Architecture -->
  <script src="js/crypto.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
